services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantry_pilot
      POSTGRES_USER: pantry_user
      POSTGRES_PASSWORD: pantry_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry_user -d pantry_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pantry_user:pantry_pass@db:5432/pantry_pilot
      APP_ENV: dev
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      # Leave these empty to use the X-User-Id fallback in local dev.
      # Set both to enable Cognito JWT verification in staging/production.
      COGNITO_REGION: ""
      COGNITO_USER_POOL_ID: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
