services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantry_pilot
      POSTGRES_USER: pantry_user
      POSTGRES_PASSWORD: pantry_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry_user -d pantry_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
